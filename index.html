<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목표 입력</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .nav-links {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .nav-links a {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 20px;
      background: #007aff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.3s;
    }
    
    .nav-links a:hover {
      background: #0056b3;
    }
    
    .nav-links a.active {
      background: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-links">
      <a href="index.html" class="active">🎯 목표 설정</a>
      <a href="process.html">📝 학습 전략</a>
      <a href="feedback.html">🧠 피드백</a>
    </div>
    
    <h1>🎯 목표 입력</h1>
    <textarea id="goal-input" placeholder="목표를 입력하세요." rows="2"></textarea>
    <button id="generate-btn">전략 생성하기</button>
    <div id="result-box" class="result-box"></div>
    <div id="output" style="white-space: pre-line; margin-top: 20px;"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
