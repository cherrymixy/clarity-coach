<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목표 입력</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎯 목표 입력</h1>
    <textarea id="goal-input" placeholder="목표를 입력하세요." rows="2"></textarea>
    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <button id="generate-btn" style="flex: 1;">전략 생성하기</button>
      <button onclick="goToScheduler()" style="flex: 1; background: #28a745; border: none; color: white; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;">📅 일정표로 바로 가기</button>
    </div>
    <div id="result-box" class="result-box"></div>
    <div id="output" style="white-space: pre-line; margin-top: 20px;"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
