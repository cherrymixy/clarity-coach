<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 일일 일정 코치</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .scheduler-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .settings-panel {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border-left: 4px solid #007aff;
    }
    
    .settings-row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .settings-item {
      flex: 1;
      min-width: 200px;
    }
    
    .settings-item label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }
    
    .settings-item input, .settings-item select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .week-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .week-tab {
      padding: 10px 16px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .week-tab:hover {
      background: #e0e0e0;
      border-color: #007aff;
    }
    
    .week-tab.active {
      background: #007aff;
      color: white;
      border-color: #007aff;
    }
    
    .daily-schedule {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .daily-schedule.today {
      border-left: 4px solid #28a745;
      background: #f8fff9;
    }
    
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .day-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
    }
    
    .day-focus {
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .time-slot {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      border-left: 3px solid #007aff;
    }
    
    .time-slot.break {
      border-left-color: #ffc107;
      background: #fffbf0;
    }
    
    .time-slot.important {
      border-left-color: #dc3545;
      background: #fff5f5;
    }
    
    .time-label {
      font-weight: 600;
      color: #007aff;
      min-width: 100px;
      margin-right: 16px;
      font-size: 14px;
    }
    
    .time-slot.break .time-label {
      color: #f57c00;
    }
    
    .time-slot.important .time-label {
      color: #dc3545;
    }
    
    .activity-content {
      flex: 1;
    }
    
    .activity-title {
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }
    
    .activity-description {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
    
    .generate-btn {
      background: linear-gradient(135deg, #007aff, #0056b3);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 20px;
    }
    
    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }
    
    .generate-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .summary-box {
      background: #f0f8ff;
      border: 1px solid #b3d9ff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    
    .summary-box h4 {
      margin: 0 0 8px 0;
      color: #1976d2;
    }
    
    .tips-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    
    .tips-box h4 {
      margin: 0 0 8px 0;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="scheduler-container">
    <h1>📅 일일 일정 코치</h1>
    <div id="goal-view" style="margin-bottom:20px; color:#555; font-size:1.05rem;"></div>
    
    <!-- 설정 패널 -->
    <div class="settings-panel">
      <h3 style="margin-top: 0; margin-bottom: 16px;">⚙️ 일정 설정</h3>
      <div class="settings-row">
        <div class="settings-item">
          <label for="available-time">📅 가용 시간대</label>
          <select id="available-time">
            <option value="9-18">오전 9시 ~ 오후 6시</option>
            <option value="8-17">오전 8시 ~ 오후 5시</option>
            <option value="10-19">오전 10시 ~ 오후 7시</option>
            <option value="custom">직접 설정</option>
          </select>
        </div>
        <div class="settings-item">
          <label for="daily-hours">⏰ 하루 학습 가능 시간</label>
          <select id="daily-hours">
            <option value="2">2시간</option>
            <option value="3" selected>3시간</option>
            <option value="4">4시간</option>
            <option value="5">5시간</option>
            <option value="6">6시간</option>
          </select>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-item">
          <label for="break-preference">💤 휴식 선호도</label>
          <select id="break-preference">
            <option value="frequent">자주 짧게 (25분마다 5분)</option>
            <option value="moderate" selected>적당히 (50분마다 10분)</option>
            <option value="minimal">최소한 (90분마다 15분)</option>
          </select>
        </div>
        <div class="settings-item">
          <label for="difficulty-level">🎯 난이도 조절</label>
          <select id="difficulty-level">
            <option value="easy">여유롭게</option>
            <option value="moderate" selected>적당하게</option>
            <option value="challenging">도전적으로</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 주차 선택 탭 -->
    <div class="week-tabs">
      <div class="week-tab active" onclick="selectWeek(1)">1주차</div>
      <div class="week-tab" onclick="selectWeek(2)">2주차</div>
      <div class="week-tab" onclick="selectWeek(3)">3주차</div>
      <div class="week-tab" onclick="selectWeek(4)">4주차</div>
    </div>

    <!-- 일정 생성 버튼 -->
    <button class="generate-btn" onclick="generateSchedule()">📋 이번 주 일정표 생성하기</button>

    <!-- 로딩 표시 -->
    <div id="loading" class="loading" style="display: none;">
      <div>🤖 Scheduler Agent가 최적의 일정을 구성하고 있습니다...</div>
      <div style="font-size: 14px; margin-top: 8px; color: #999;">Strategy Agent의 전략을 바탕으로 실천 가능한 시간표를 만들어드려요</div>
    </div>

    <!-- 일정 결과 -->
    <div id="schedule-result"></div>
  </div>

  <script>
    let currentWeek = 1;
    let strategicData = null;

    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function() {
      // 목표 불러오기
      const goal = localStorage.getItem('user_goal') || '';
      const selectedStrategy = localStorage.getItem('selected_strategy') || '체계적 계획형';
      
      document.getElementById('goal-view').innerHTML = `
        <strong>목표:</strong> ${goal}<br>
        <strong>선택된 전략:</strong> ${selectedStrategy}
      `;

      // Strategy Agent에서 전달된 데이터 불러오기
      strategicData = JSON.parse(localStorage.getItem('strategic_data') || 'null');
    });

    // 주차 선택
    function selectWeek(week) {
      currentWeek = week;
      document.querySelectorAll('.week-tab').forEach((tab, index) => {
        tab.classList.toggle('active', index === week - 1);
      });
    }

    // 일정 생성
    async function generateSchedule() {
      const generateBtn = document.querySelector('.generate-btn');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('schedule-result');

      // 설정 값 가져오기
      const availableTime = document.getElementById('available-time').value;
      const dailyHours = document.getElementById('daily-hours').value;
      const breakPreference = document.getElementById('break-preference').value;
      const difficultyLevel = document.getElementById('difficulty-level').value;

      generateBtn.disabled = true;
      loading.style.display = 'block';
      resultDiv.innerHTML = '';

      try {
        const goal = localStorage.getItem('user_goal') || '';
        const selectedStrategy = localStorage.getItem('selected_strategy') || '체계적 계획형';

        // AI에게 보낼 프롬프트 구성
        const prompt = `당신은 "일일 일정 코치" Scheduler Agent입니다.

🎯 역할: Strategy Agent가 제공한 주간 전략을 바탕으로 실천 가능한 일일 세부 일정표를 만들어주세요.

📥 입력 정보:
- 목표: ${goal}
- 선택된 전략: ${selectedStrategy}
- 현재 주차: ${currentWeek}주차
- 가용 시간대: ${availableTime}
- 하루 학습 시간: ${dailyHours}시간
- 휴식 선호도: ${breakPreference}
- 난이도: ${difficultyLevel}

🗣 말투: 너무 빡빡하지 않게, 실천 가능하고 친절한 말투로 안내해주세요.

📤 출력 요구사항:
1. 월~금 요일별 상세 시간표
2. 각 활동에 필요한 시간 예측 및 분배
3. 비슷한 활동은 묶어서 배치하여 집중력 향상
4. 하루 2~3개 핵심 작업 이내로 제한
5. 쉬는 시간과 피드백 시간 포함
6. 실천 가능한 구체적 행동으로 제시

JSON 형식으로 응답해주세요:
{
  "weekSummary": "이번 주 전체 학습 목표와 흐름을 간단히 설명",
  "dailySchedules": [
    {
      "day": "월요일",
      "focus": "오늘의 핵심 테마",
      "timeSlots": [
        {
          "time": "09:00-10:30",
          "title": "활동 제목",
          "description": "구체적인 실행 방법과 기대 효과",
          "type": "work" // work, break, feedback 중 하나
        }
      ]
    }
  ],
  "tips": [
    "실천을 위한 구체적인 팁들"
  ]
}`;

        // OpenAI API 호출
        const response = await fetch('/api/gpt', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            messages: [
              {
                role: 'system',
                content: 'You are a helpful daily schedule coach. Respond only with valid JSON format.'
              },
              {
                role: 'user',
                content: prompt
              }
            ]
          })
        });

        const data = await response.json();
        
        if (data.choices && data.choices[0]) {
          let content = data.choices[0].message.content.trim();
          
          // JSON 파싱을 위해 코드 블록 제거
          if (content.startsWith('```json')) {
            content = content.slice(7);
          }
          if (content.endsWith('```')) {
            content = content.slice(0, -3);
          }
          
          const scheduleData = JSON.parse(content);
          displaySchedule(scheduleData);
        } else {
          throw new Error('AI 응답을 받을 수 없습니다.');
        }

      } catch (error) {
        console.error('일정 생성 오류:', error);
        resultDiv.innerHTML = `
          <div class="daily-schedule" style="text-align: center; color: #d00;">
            <h3>⚠️ 일정 생성 중 오류가 발생했습니다</h3>
            <p>잠시 후 다시 시도해주세요.</p>
          </div>
        `;
      } finally {
        generateBtn.disabled = false;
        loading.style.display = 'none';
      }
    }

    // 일정 표시
    function displaySchedule(scheduleData) {
      const resultDiv = document.getElementById('schedule-result');
      
      let html = `
        <div class="summary-box">
          <h4>📋 ${currentWeek}주차 학습 목표</h4>
          <p>${scheduleData.weekSummary}</p>
        </div>
      `;

      scheduleData.dailySchedules.forEach((day, index) => {
        const isToday = new Date().getDay() === (index + 1) % 7;
        
        html += `
          <div class="daily-schedule ${isToday ? 'today' : ''}">
            <div class="day-header">
              <div class="day-title">${day.day} ${isToday ? '(오늘)' : ''}</div>
              <div class="day-focus">${day.focus}</div>
            </div>
        `;

        day.timeSlots.forEach(slot => {
          const typeClass = slot.type === 'break' ? 'break' : 
                          slot.type === 'feedback' ? 'important' : '';
          
          html += `
            <div class="time-slot ${typeClass}">
              <div class="time-label">${slot.time}</div>
              <div class="activity-content">
                <div class="activity-title">${slot.title}</div>
                <div class="activity-description">${slot.description}</div>
              </div>
            </div>
          `;
        });

        html += '</div>';
      });

      if (scheduleData.tips && scheduleData.tips.length > 0) {
        html += `
          <div class="tips-box">
            <h4>💡 실천 팁</h4>
            <ul>
        `;
        scheduleData.tips.forEach(tip => {
          html += `<li>${tip}</li>`;
        });
        html += `
            </ul>
          </div>
        `;
      }

      resultDiv.innerHTML = html;
    }
  </script>
</body>
</html>
