<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <h1>📅 일일 일정 코치</h1>
    <p class="subtitle">Strategy Agent의 전략을 받아서 상세한 일일 일정표를 생성합니다</p>
    
    <!-- 설정 패널 -->
    <div class="scheduler-settings">
      <h3>⚙️ 일정 설정</h3>
      <div class="setting-group">
        <label for="weekNumber">주차 선택:</label>
        <select id="weekNumber">
          <option value="1">1주차</option>
          <option value="2">2주차</option>
          <option value="3">3주차</option>
          <option value="4">4주차</option>
        </select>
      </div>
      
      <div class="setting-group">
        <label for="startTime">시작 시간:</label>
        <input type="time" id="startTime" value="09:00">
      </div>
      
      <div class="setting-group">
        <label for="endTime">종료 시간:</label>
        <input type="time" id="endTime" value="18:00">
      </div>
      
      <div class="setting-group">
        <label for="dailyStudyTime">하루 학습 시간 (시간):</label>
        <input type="number" id="dailyStudyTime" value="3" min="1" max="8">
      </div>
      
      <button class="generate-btn" onclick="generateSchedule()">📋 일정표 생성하기</button>
    </div>
    
    <!-- 전략 선택 -->
    <div class="strategy-selection">
      <h3>🎯 전략 선택</h3>
      <div class="strategy-tabs">
        <div class="strategy-tab active" onclick="selectStrategy(0)">🎯 체계적 계획형</div>
        <div class="strategy-tab" onclick="selectStrategy(1)">🔥 실습 중심 몰입형</div>
        <div class="strategy-tab" onclick="selectStrategy(2)">💡 감각적 체험형</div>
      </div>
    </div>
    
    <!-- 일정표 결과 -->
    <div id="schedule-result"></div>
  </div>

  <script src="scheduler-agent.js"></script>

    let selectedStrategyIndex = 0;
    let schedulerAgent;
    
    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function() {
      schedulerAgent = new SchedulerAgent();
      loadStrategyData();
    });
    
    // 전략 선택
    function selectStrategy(index) {
      selectedStrategyIndex = index;
      
      // 탭 활성화
      document.querySelectorAll('.strategy-tab').forEach((tab, i) => {
        tab.classList.toggle('active', i === index);
      });
    }

    // 일정표 생성
    function generateSchedule() {
      const weekNumber = document.getElementById('weekNumber').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;
      const dailyStudyTime = parseInt(document.getElementById('dailyStudyTime').value);
      
      // 시간 설정 변환
      const startHour = parseInt(startTime.split(':')[0]);
      const endHour = parseInt(endTime.split(':')[0]);
      
      const customSettings = {
        availableHours: {
          start: startHour,
          end: endHour
        },
        dailyStudyTime: dailyStudyTime
      };
      
      // 선택된 전략 데이터
      const selectedStrategy = window.strategyData[selectedStrategyIndex];
      
      // Scheduler Agent로 일정표 생성
      const weeklySchedule = schedulerAgent.generateDailySchedule(
        selectedStrategy, 
        weekNumber, 
        customSettings
      );
      
      // HTML로 렌더링
      const scheduleHTML = schedulerAgent.renderScheduleHTML(weeklySchedule);
      document.getElementById('schedule-result').innerHTML = scheduleHTML;
      
      // 스크롤을 결과로 이동
      document.getElementById('schedule-result').scrollIntoView({ 
        behavior: 'smooth' 
      });
    }
