<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 일일 일정 코치</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .scheduler-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .settings-panel {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border-left: 4px solid #007aff;
    }
    
    .settings-row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .settings-item {
      flex: 1;
      min-width: 200px;
    }
    
    .settings-item label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }
    
    .settings-item input, .settings-item select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .week-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .week-tab {
      padding: 10px 16px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .week-tab:hover {
      background: #e0e0e0;
      border-color: #007aff;
    }
    
    .week-tab.active {
      background: #007aff;
      color: white;
      border-color: #007aff;
    }
    
    .daily-schedule {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .daily-schedule.today {
      border-left: 4px solid #28a745;
      background: #f8fff9;
    }
    
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .day-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
    }
    
    .day-focus {
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .time-slot {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      border-left: 3px solid #007aff;
    }
    
    .time-slot.break {
      border-left-color: #ffc107;
      background: #fffbf0;
    }
    
    .time-slot.important {
      border-left-color: #dc3545;
      background: #fff5f5;
    }
    
    .time-label {
      font-weight: 600;
      color: #007aff;
      min-width: 100px;
      margin-right: 16px;
      font-size: 14px;
    }
    
    .time-slot.break .time-label {
      color: #f57c00;
    }
    
    .time-slot.important .time-label {
      color: #dc3545;
    }
    
    .activity-content {
      flex: 1;
    }
    
    .activity-title {
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }
    
    .activity-description {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
    
    .generate-btn {
      background: linear-gradient(135deg, #007aff, #0056b3);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 20px;
    }
    
    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }
    
    .generate-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .summary-box {
      background: #f0f8ff;
      border: 1px solid #b3d9ff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    
    .summary-box h4 {
      margin: 0 0 8px 0;
      color: #1976d2;
    }
    
    .tips-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    
    .tips-box h4 {
      margin: 0 0 8px 0;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="scheduler-container">
    <h1>📅 일일 일정 코치</h1>
    <div id="goal-view" style="margin-bottom:20px; color:#555; font-size:1.05rem;"></div>
    
    <!-- 설정 패널 -->
    <div class="settings-panel">
      <h3 style="margin-top: 0; margin-bottom: 16px;">⚙️ 일정 설정</h3>
      <div class="settings-row">
        <div class="settings-item">
          <label for="available-time">📅 가용 시간대</label>
          <select id="available-time">
            <option value="9-18">오전 9시 ~ 오후 6시</option>
            <option value="8-17">오전 8시 ~ 오후 5시</option>
            <option value="10-19">오전 10시 ~ 오후 7시</option>
            <option value="custom">직접 설정</option>
          </select>
        </div>
        <div class="settings-item">
          <label for="daily-hours">⏰ 하루 학습 가능 시간</label>
          <select id="daily-hours">
            <option value="2">2시간</option>
            <option value="3" selected>3시간</option>
            <option value="4">4시간</option>
            <option value="5">5시간</option>
            <option value="6">6시간</option>
          </select>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-item">
          <label for="break-preference">💤 휴식 선호도</label>
          <select id="break-preference">
            <option value="frequent">자주 짧게 (25분마다 5분)</option>
            <option value="moderate" selected>적당히 (50분마다 10분)</option>
            <option value="minimal">최소한 (90분마다 15분)</option>
          </select>
        </div>
        <div class="settings-item">
          <label for="difficulty-level">🎯 난이도 조절</label>
          <select id="difficulty-level">
            <option value="easy">여유롭게</option>
            <option value="moderate" selected>적당하게</option>
            <option value="challenging">도전적으로</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 주차 선택 탭 -->
    <div class="week-tabs">
      <div class="week-tab active" onclick="selectWeek(1)">1주차</div>
      <div class="week-tab" onclick="selectWeek(2)">2주차</div>
      <div class="week-tab" onclick="selectWeek(3)">3주차</div>
      <div class="week-tab" onclick="selectWeek(4)">4주차</div>
    </div>

    <!-- 일정 생성 버튼 -->
    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <button class="generate-btn" onclick="generateTodaySchedule()" style="flex: 1; background: linear-gradient(135deg, #28a745, #20c997);">
        📅 오늘만 생성하기 (<span id="today-label">오늘</span>)
      </button>
      <button class="generate-btn" onclick="generateSchedule()" style="flex: 1;">
        📋 이번 주 전체 생성하기
      </button>
    </div>

    <!-- 로딩 표시 -->
    <div id="loading" class="loading" style="display: none;">
      <div>🤖 Scheduler Agent가 최적의 일정을 구성하고 있습니다...</div>
      <div style="font-size: 14px; margin-top: 8px; color: #999;">Strategy Agent의 전략을 바탕으로 실천 가능한 시간표를 만들어드려요</div>
    </div>

    <!-- 일정 결과 -->
    <div id="schedule-result"></div>
  </div>

  <script>
    let currentWeek = 1;
    let strategicData = null;

    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function() {
      // 목표 불러오기
      const goal = localStorage.getItem('user_goal') || '';
      const selectedStrategy = localStorage.getItem('selected_strategy') || '체계적 계획형';
      
      document.getElementById('goal-view').innerHTML = `
        <strong>목표:</strong> ${goal}<br>
        <strong>선택된 전략:</strong> ${selectedStrategy}
      `;

      // Strategy Agent에서 전달된 데이터 불러오기
      strategicData = JSON.parse(localStorage.getItem('strategic_data') || 'null');
      
      // 오늘 요일 표시
      updateTodayLabel();
    });
    
    // 오늘 요일 업데이트
    function updateTodayLabel() {
      const today = new Date();
      const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      const koreanDayNames = ['월요일', '화요일', '수요일', '목요일', '금요일'];
      const todayName = dayNames[today.getDay()];
      
      const todayLabel = document.getElementById('today-label');
      if (koreanDayNames.includes(todayName)) {
        todayLabel.textContent = todayName;
        todayLabel.parentElement.style.display = 'block';
      } else {
        // 주말인 경우 다음 월요일로 설정
        const nextMonday = new Date(today);
        nextMonday.setDate(today.getDate() + (8 - today.getDay()) % 7);
        todayLabel.textContent = '다음 월요일';
        todayLabel.parentElement.style.display = 'block';
      }
    }

    // 주차 선택
    function selectWeek(week) {
      currentWeek = week;
      document.querySelectorAll('.week-tab').forEach((tab, index) => {
        tab.classList.toggle('active', index === week - 1);
      });
    }

    // 일정 생성
    async function generateSchedule() {
      const generateBtn = document.querySelector('.generate-btn');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('schedule-result');

      // 설정 값 가져오기
      const availableTime = document.getElementById('available-time').value;
      const dailyHours = document.getElementById('daily-hours').value;
      const breakPreference = document.getElementById('break-preference').value;
      const difficultyLevel = document.getElementById('difficulty-level').value;

      generateBtn.disabled = true;
      loading.style.display = 'block';
      resultDiv.innerHTML = '';

      try {
        const goal = localStorage.getItem('user_goal') || '';
        const selectedStrategy = localStorage.getItem('selected_strategy') || '체계적 계획형';

                 // 시간 슬롯 템플릿 생성
         const timeTemplate = generateTimeTemplate(availableTime, dailyHours, breakPreference);
         
         // AI에게 보낼 프롬프트 구성
         const prompt = `당신은 "일일 일정 코치" Scheduler Agent입니다.

🎯 역할: Strategy Agent가 제공한 주간 전략을 바탕으로 실천 가능한 일일 세부 일정표를 만들어주세요.

📥 입력 정보:
- 목표: ${goal}
- 선택된 전략: ${selectedStrategy}
- 현재 주차: ${currentWeek}주차
- 가용 시간대: ${availableTime}
- 하루 학습 시간: ${dailyHours}시간
- 휴식 선호도: ${breakPreference}
- 난이도: ${difficultyLevel}

🗣 말투: 너무 빡빡하지 않게, 실천 가능하고 친절한 말투로 안내해주세요.

⚠️ 중요: 아래 미리 정의된 시간 템플릿을 사용하여 각 시간대에 맞는 활동만 제안해주세요. 시간은 절대 변경하지 마세요!

시간 템플릿:
${JSON.stringify(timeTemplate, null, 2)}

📤 출력 요구사항:
1. 위 시간 템플릿의 각 슬롯에 목표에 맞는 구체적인 활동 내용 배정
2. title: 간결하고 구체적인 활동명 (20자 이내)
3. description: 실행 방법과 기대 효과 (50자 이내)
4. type은 이미 설정되어 있으니 변경하지 마세요
5. 비슷한 활동은 연속으로 배치하여 집중력 향상
6. 실천 가능한 구체적 행동으로 제시

JSON 형식으로 응답해주세요:
{
  "weekSummary": "이번 주 전체 학습 목표와 흐름을 한 문장으로 설명",
  "dailySchedules": [위 시간 템플릿을 그대로 사용하되 title과 description만 채워주세요],
  "tips": ["실천을 위한 구체적인 팁 3개"]
}

시간과 type은 절대 변경하지 마시고, title과 description만 목표에 맞게 채워주세요!`;

        // OpenAI API 호출
        const response = await fetch('/api/gpt', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            messages: [
              {
                role: 'system',
                content: 'You are a helpful daily schedule coach. Respond only with valid JSON format.'
              },
              {
                role: 'user',
                content: prompt
              }
            ]
          })
        });

                 const data = await response.json();
         
         if (data.choices && data.choices[0]) {
           let content = data.choices[0].message.content.trim();
           
           // JSON 파싱을 위해 코드 블록 제거
           if (content.startsWith('```json')) {
             content = content.slice(7);
           }
           if (content.endsWith('```')) {
             content = content.slice(0, -3);
           }
           
                        try {
               const scheduleData = JSON.parse(content);
               
               // 템플릿과 AI 응답 병합
               const finalData = mergeWithTemplate(timeTemplate, scheduleData);
               displaySchedule(finalData);
             } catch (parseError) {
               console.error('JSON 파싱 오류:', parseError);
               throw new Error('AI 응답 형식이 올바르지 않습니다. 다시 시도해주세요.');
             }
         } else {
           throw new Error('AI 응답을 받을 수 없습니다.');
         }

      } catch (error) {
        console.error('일정 생성 오류:', error);
        resultDiv.innerHTML = `
          <div class="daily-schedule" style="text-align: center; color: #d00;">
            <h3>⚠️ 일정 생성 중 오류가 발생했습니다</h3>
            <p>잠시 후 다시 시도해주세요.</p>
          </div>
        `;
      } finally {
        generateBtn.disabled = false;
        loading.style.display = 'none';
      }
         }

     // 오늘만 일정 생성
     async function generateTodaySchedule() {
       const generateBtn = document.querySelector('.generate-btn');
       const loading = document.getElementById('loading');
       const resultDiv = document.getElementById('schedule-result');

       // 오늘 요일 확인
       const today = new Date();
       const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
       const koreanDayNames = ['월요일', '화요일', '수요일', '목요일', '금요일'];
       const todayName = dayNames[today.getDay()];
       
       if (!koreanDayNames.includes(todayName)) {
         alert('평일(월~금)에만 일정을 생성할 수 있습니다.');
         return;
       }

       // 설정 값 가져오기
       const availableTime = document.getElementById('available-time').value;
       const dailyHours = document.getElementById('daily-hours').value;
       const breakPreference = document.getElementById('break-preference').value;
       const difficultyLevel = document.getElementById('difficulty-level').value;

       loading.style.display = 'block';
       resultDiv.innerHTML = '';

       try {
         const goal = localStorage.getItem('user_goal') || '';
         const selectedStrategy = localStorage.getItem('selected_strategy') || '체계적 계획형';

         // 오늘만의 시간 템플릿 생성
         const todayTemplate = generateSingleDayTemplate(todayName, availableTime, dailyHours, breakPreference);
         
         // AI에게 보낼 프롬프트 구성
         const prompt = `당신은 "일일 일정 코치" Scheduler Agent입니다.

🎯 역할: 오늘(${todayName}) 하루 일정을 구체적으로 만들어주세요.

📥 입력 정보:
- 목표: ${goal}
- 선택된 전략: ${selectedStrategy}
- 오늘: ${todayName}
- 가용 시간대: ${availableTime}
- 하루 학습 시간: ${dailyHours}시간
- 휴식 선호도: ${breakPreference}
- 난이도: ${difficultyLevel}

⚠️ 중요: 아래 미리 정의된 시간 템플릿을 사용하여 각 시간대에 맞는 활동만 제안해주세요. 시간은 절대 변경하지 마세요!

오늘의 시간 템플릿:
${JSON.stringify(todayTemplate, null, 2)}

📤 출력 요구사항:
1. 위 시간 템플릿의 각 슬롯에 목표에 맞는 구체적인 활동 내용 배정
2. title: 간결하고 구체적인 활동명 (20자 이내)
3. description: 실행 방법과 기대 효과 (50자 이내)
4. type은 이미 설정되어 있으니 변경하지 마세요
5. 실천 가능한 구체적 행동으로 제시

JSON 형식으로 응답해주세요:
{
  "todaySummary": "오늘의 학습 목표를 한 문장으로 설명",
  "todaySchedule": {
    "day": "${todayName}",
    "focus": "오늘의 핵심 테마",
    "timeSlots": [위 시간 템플릿을 그대로 사용하되 title과 description만 채워주세요]
  },
  "tips": ["오늘 실천을 위한 구체적인 팁 3개"]
}

시간과 type은 절대 변경하지 마시고, title과 description만 목표에 맞게 채워주세요!`;

         // OpenAI API 호출
         const response = await fetch('/api/gpt', {
           method: 'POST',
           headers: {
             'Content-Type': 'application/json',
           },
           body: JSON.stringify({
             messages: [
               {
                 role: 'system',
                 content: 'You are a helpful daily schedule coach. Respond only with valid JSON format.'
               },
               {
                 role: 'user',
                 content: prompt
               }
             ]
           })
         });

         const data = await response.json();
         
         if (data.choices && data.choices[0]) {
           let content = data.choices[0].message.content.trim();
           
           // JSON 파싱을 위해 코드 블록 제거
           if (content.startsWith('```json')) {
             content = content.slice(7);
           }
           if (content.endsWith('```')) {
             content = content.slice(0, -3);
           }
           
           try {
             const scheduleData = JSON.parse(content);
             
             // 템플릿과 AI 응답 병합 (오늘만)
             const finalData = mergeWithTodayTemplate(todayTemplate, scheduleData);
             displayTodaySchedule(finalData, todayName);
           } catch (parseError) {
             console.error('JSON 파싱 오류:', parseError);
             throw new Error('AI 응답 형식이 올바르지 않습니다. 다시 시도해주세요.');
           }
         } else {
           throw new Error('AI 응답을 받을 수 없습니다.');
         }

       } catch (error) {
         console.error('일정 생성 오류:', error);
         resultDiv.innerHTML = `
           <div class="daily-schedule" style="text-align: center; color: #d00;">
             <h3>⚠️ 일정 생성 중 오류가 발생했습니다</h3>
             <p>잠시 후 다시 시도해주세요.</p>
           </div>
         `;
       } finally {
         loading.style.display = 'none';
       }
     }

     // 시간 템플릿 생성 함수
     function generateTimeTemplate(availableTime, dailyHours, breakPreference) {
       const days = ['월요일', '화요일', '수요일', '목요일', '금요일'];
       const dailySchedules = [];
       
       // 가용 시간대 파싱
       let [startHour, endHour] = availableTime.split('-').map(h => parseInt(h));
       if (availableTime === 'custom') {
         startHour = 9;
         endHour = 18;
       }
       
       // 휴식 패턴 설정
       const breakPatterns = {
         'frequent': { workDuration: 25, breakDuration: 5 },    // 25분 작업, 5분 휴식
         'moderate': { workDuration: 50, breakDuration: 10 },   // 50분 작업, 10분 휴식  
         'minimal': { workDuration: 90, breakDuration: 15 }     // 90분 작업, 15분 휴식
       };
       
       const pattern = breakPatterns[breakPreference] || breakPatterns['moderate'];
       const totalHours = parseInt(dailyHours);
       
       days.forEach((day, dayIndex) => {
         const timeSlots = [];
         let currentTime = startHour * 60; // 분으로 변환
         const endTime = Math.min(startHour * 60 + totalHours * 60, endHour * 60);
         
         let sessionCount = 0;
         
         while (currentTime < endTime) {
           // 작업 세션 추가
           const workEndTime = Math.min(currentTime + pattern.workDuration, endTime);
           if (workEndTime > currentTime) {
             const currentHour = Math.floor(currentTime / 60);
             let defaultTitle = "";
             let defaultDescription = "";
             
             // 시간대별 기본 활동 제안
             if (currentHour < 10) {
               defaultTitle = "이론 학습";
               defaultDescription = "집중력이 높은 오전 시간을 활용한 개념 학습";
             } else if (currentHour < 12) {
               defaultTitle = "실습 활동";
               defaultDescription = "오전에 학습한 내용을 바탕으로 한 실제 연습";
             } else if (currentHour < 14) {
               defaultTitle = "복습 및 정리";
               defaultDescription = "오전 학습 내용 복습 및 노트 정리";
             } else if (currentHour < 16) {
               defaultTitle = "심화 학습";
               defaultDescription = "오후 시간을 활용한 심화 내용 학습";
             } else {
               defaultTitle = "실전 연습";
               defaultDescription = "하루 학습 내용을 종합한 실전 문제 해결";
             }
             
             timeSlots.push({
               time: `${formatTime(currentTime)}-${formatTime(workEndTime)}`,
               title: defaultTitle,
               description: defaultDescription,
               type: "work"
             });
             
             currentTime = workEndTime;
             sessionCount++;
           }
           
           // 휴식 시간 추가 (마지막이 아닌 경우에만)
           if (currentTime < endTime && currentTime + pattern.breakDuration <= endTime) {
             const breakEndTime = currentTime + pattern.breakDuration;
             timeSlots.push({
               time: `${formatTime(currentTime)}-${formatTime(breakEndTime)}`,
               title: "휴식",
               description: "가벼운 스트레칭이나 차 마시기",
               type: "break"
             });
             
             currentTime = breakEndTime;
           } else {
             break;
           }
         }
         
         // 금요일에는 주간 회고 시간 추가
         if (dayIndex === 4 && timeSlots.length > 0) {
           // 마지막 작업 시간을 30분 줄이고 회고 시간 추가
           const lastWorkSlot = timeSlots.filter(slot => slot.type === 'work').pop();
           if (lastWorkSlot) {
             const [startTime, endTime] = lastWorkSlot.time.split('-');
             const endMinutes = timeToMinutes(endTime);
             const reviewStartMinutes = endMinutes - 30;
             
             if (reviewStartMinutes > timeToMinutes(startTime)) {
               lastWorkSlot.time = `${startTime}-${formatTime(reviewStartMinutes)}`;
               
               timeSlots.push({
                 time: `${formatTime(reviewStartMinutes)}-${formatTime(endMinutes)}`,
                 title: "주간 회고",
                 description: "이번 주 학습 성과 정리 및 다음 주 계획",
                 type: "feedback"
               });
             }
           }
         }
         
         dailySchedules.push({
           day: day,
           focus: "학습 활동",
           timeSlots: timeSlots
         });
       });
       
       return {
         weekSummary: `${currentWeek}주차 학습 목표입니다.`,
         dailySchedules: dailySchedules,
         tips: []
       };
     }
     
     // 시간 형식 변환 함수들
     function formatTime(minutes) {
       const hours = Math.floor(minutes / 60);
       const mins = minutes % 60;
       return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
     }
     
     function timeToMinutes(timeStr) {
       const [hours, minutes] = timeStr.split(':').map(n => parseInt(n));
       return hours * 60 + minutes;
     }

     // 오늘 템플릿과 AI 응답 병합 함수
     function mergeWithTodayTemplate(template, aiResponse) {
       // 템플릿을 깊은 복사
       const result = JSON.parse(JSON.stringify(template));
       
       // AI 응답에서 유효한 데이터 추출
       if (aiResponse && typeof aiResponse === 'object') {
         // todaySchedule 업데이트
         if (aiResponse.todaySchedule && typeof aiResponse.todaySchedule === 'object') {
           const aiSchedule = aiResponse.todaySchedule;
           
           // focus 업데이트
           if (aiSchedule.focus && typeof aiSchedule.focus === 'string') {
             result.focus = aiSchedule.focus;
           }
           
           // timeSlots 업데이트 (title과 description만)
           if (Array.isArray(aiSchedule.timeSlots)) {
             result.timeSlots.forEach((templateSlot, slotIndex) => {
               const aiSlot = aiSchedule.timeSlots[slotIndex];
               if (aiSlot && typeof aiSlot === 'object') {
                 // title 업데이트 (유효한 경우에만)
                 if (aiSlot.title && typeof aiSlot.title === 'string' && aiSlot.title.trim()) {
                   templateSlot.title = aiSlot.title.trim();
                 }
                 
                 // description 업데이트 (유효한 경우에만)
                 if (aiSlot.description && typeof aiSlot.description === 'string' && aiSlot.description.trim()) {
                   templateSlot.description = aiSlot.description.trim();

       const result = JSON.parse(JSON.stringify(template));
       
       // AI 응답에서 유효한 데이터 추출

               if (Array.isArray(aiDay.timeSlots)) {
                 templateDay.timeSlots.forEach((templateSlot, slotIndex) => {
                   const aiSlot = aiDay.timeSlots[slotIndex];
                   if (aiSlot && typeof aiSlot === 'object') {
                     // title 업데이트 (유효한 경우에만)

                       templateSlot.title = aiSlot.title.trim();
                     }
                     
                     // description 업데이트 (유효한 경우에만)
                     if (aiSlot.description && typeof aiSlot.description === 'string' && aiSlot.description.trim()) {
                       templateSlot.description = aiSlot.description.trim();
                     }
                     
                     // time과 type은 템플릿 유지 (절대 변경하지 않음)

     // 데이터 검증 및 정규화 함수
     function validateAndNormalizeSchedule(data) {
       const defaultDays = ['월요일', '화요일', '수요일', '목요일', '금요일'];
       const validTypes = ['work', 'break', 'feedback'];
       
       // 기본 구조 확인
       if (!data || typeof data !== 'object') {
         throw new Error('잘못된 데이터 구조입니다.');
       }
       
       // weekSummary 검증
       if (!data.weekSummary || typeof data.weekSummary !== 'string') {
         data.weekSummary = `${currentWeek}주차 학습 목표입니다.`;
       }
       
       // dailySchedules 검증
       if (!Array.isArray(data.dailySchedules)) {
         data.dailySchedules = [];
       }
       
       // 5일 고정 및 누락된 요일 추가
       const normalizedSchedules = [];
       defaultDays.forEach((dayName, index) => {
         let dayData = data.dailySchedules.find(d => d.day === dayName) || 
                      data.dailySchedules[index] || 
                      {};
         
         // 요일 이름 정규화
         dayData.day = dayName;
         
         // focus 검증
         if (!dayData.focus || typeof dayData.focus !== 'string') {
           dayData.focus = '학습 활동';
         }
         
         // timeSlots 검증
         if (!Array.isArray(dayData.timeSlots)) {
           dayData.timeSlots = [];
         }
         
         // timeSlots 정규화
         dayData.timeSlots = dayData.timeSlots.map(slot => {
           // 시간 형식 정규화
           if (!slot.time || typeof slot.time !== 'string') {
             slot.time = '09:00-10:30';
           } else {
             // 시간 형식 통일 (HH:MM-HH:MM)
             slot.time = normalizeTimeFormat(slot.time);
           }
           
           // 제목 검증
           if (!slot.title || typeof slot.title !== 'string') {
             slot.title = '학습 활동';
           }
           
           // 설명 검증
           if (!slot.description || typeof slot.description !== 'string') {
             slot.description = '구체적인 실행 방법과 기대 효과';
           }
           
           // 타입 검증
           if (!validTypes.includes(slot.type)) {
             slot.type = 'work';
           }
           
           return slot;
         });
         
         // 최소 1개 활동 보장
         if (dayData.timeSlots.length === 0) {
           dayData.timeSlots.push({
             time: '09:00-10:30',
             title: '기본 학습 활동',
             description: '목표에 따른 학습 진행',
             type: 'work'
           });
         }
         
         normalizedSchedules.push(dayData);
       });
       
       data.dailySchedules = normalizedSchedules;
       
       // tips 검증
       if (!Array.isArray(data.tips)) {
         data.tips = ['꾸준한 실천이 가장 중요합니다.', '무리하지 마시고 천천히 진행하세요.', '매일 조금씩 발전하는 모습을 확인해보세요.'];
       }
       
       return data;
     }
     
     // 시간 형식 정규화 함수
     function normalizeTimeFormat(timeStr) {
       // 다양한 시간 형식을 HH:MM-HH:MM으로 변환
       const patterns = [
         /(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/,  // 09:00-10:30, 9:00~10:30
         /(\d{1,2})시\s*(\d{0,2}분?)?\s*[-~]\s*(\d{1,2})시\s*(\d{0,2}분?)?/,  // 9시-10시, 9시30분~10시30분
         /(\d{1,2})\s*[-~]\s*(\d{1,2})/  // 9-10
       ];
       
       for (let pattern of patterns) {
         const match = timeStr.match(pattern);
         if (match) {
           let [, startHour, startMin = '00', endHour, endMin = '00'] = match;
           
           // 숫자가 아닌 문자 제거
           startHour = startHour.replace(/\D/g, '');
           startMin = startMin.replace(/\D/g, '') || '00';
           endHour = endHour.replace(/\D/g, '');
           endMin = endMin.replace(/\D/g, '') || '00';
           
           // 2자리로 패딩
           startHour = startHour.padStart(2, '0');
           startMin = startMin.padStart(2, '0');
           endHour = endHour.padStart(2, '0');
           endMin = endMin.padStart(2, '0');
           
           return `${startHour}:${startMin}-${endHour}:${endMin}`;
         }
       }
       
       // 패턴이 맞지 않으면 기본값 반환
       return '09:00-10:30';
     }
