<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목표 분석가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .analysis-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-left: 4px solid #007aff;
    }
    
    .analysis-item {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border-left: 3px solid #28a745;
    }
    
    .analysis-item h4 {
      margin: 0 0 8px 0;
      color: #28a745;
      font-size: 1.1rem;
    }
    
    .analysis-item p {
      margin: 0;
      color: #666;
      line-height: 1.5;
    }
    
    .keyword-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    
    .keyword-tag {
      background: #007aff;
      color: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .timeline-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .timeline-week {
      background: #007aff;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      min-width: 60px;
      text-align: center;
    }
    
    .timeline-content {
      flex: 1;
      background: #e8f4f8;
      padding: 10px 16px;
      border-radius: 6px;
    }
    
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    
    .action-buttons button {
      flex: 1;
      min-width: 200px;
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: 600;
    }
    
    .button-secondary {
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .button-secondary:hover {
      background: #5a6268;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .goal-display {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .goal-display h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
    }
    
    .goal-display p {
      margin: 0;
      opacity: 0.9;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 목표 분석가</h1>
    <p style="color: #666; margin-bottom: 24px;">
      입력하신 목표를 깊이 분석하여 효과적인 학습 전략의 기초 데이터를 생성합니다.
    </p>
    
    <div id="goal-display" class="goal-display">
      <h2>🎯 분석할 목표</h2>
      <p id="goal-text">목표를 불러오는 중...</p>
    </div>
    
    <button id="analyze-btn" class="button">🔍 목표 분석 시작하기</button>
    
    <div id="analysis-result" style="display: none;">
      <div class="analysis-section">
        <h3>📋 분석 결과</h3>
        <div id="analysis-content"></div>
        
        <div class="action-buttons">
          <button id="to-strategy-btn" class="button">🧠 전략 설계로 이동</button>
          <button id="modify-goal-btn" class="button-secondary">✏️ 목표 수정하기</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let analysisData = null;
    
    // 목표 불러오기
    const goal = localStorage.getItem('user_goal') || '';
    if (goal) {
      document.getElementById('goal-text').textContent = goal;
    } else {
      document.getElementById('goal-text').textContent = '목표가 설정되지 않았습니다.';
      document.getElementById('analyze-btn').disabled = true;
    }
    
    document.getElementById('analyze-btn').addEventListener('click', async () => {
      if (!goal) {
        alert('목표가 설정되지 않았습니다. 처음부터 다시 시작해주세요.');
        window.location.href = 'index.html';
        return;
      }
      
      const resultDiv = document.getElementById('analysis-result');
      const contentDiv = document.getElementById('analysis-content');
      
      resultDiv.style.display = 'block';
      contentDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>목표를 세밀하게 분석하고 있습니다...</p>
        </div>
      `;
      
      try {
        const response = await fetch('/api/gpt', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: [
              {
                role: 'system',
                content: `너는 "목표 분석가" 역할을 맡은 Planner Agent야.

🌱 말투: 분석적이고 통찰력 있게. 마치 전문 컨설턴트처럼 목표를 다각도로 분석해줘.

🧠 기능:
1. 사용자의 목표를 구체적으로 분석해서 핵심 요소들을 추출해.
2. 목표 달성에 필요한 기간을 현실적으로 추정해.
3. 핵심 키워드와 학습 영역을 파악해.
4. 주당 적절한 과제 수를 제안해.

다음 JSON 형태로 응답해줘:
{
  "main_goal": "목표를 한 문장으로 정리",
  "goal_breakdown": "목표를 세부적으로 분석한 설명 (2-3문장)",
  "duration_weeks": 4,
  "duration_reason": "기간 설정 이유",
  "keywords": ["키워드1", "키워드2", "키워드3"],
  "tasks_per_week": 2,
  "difficulty_level": "초급/중급/고급",
  "expected_timeline": {
    "week1": "1주차 예상 진행사항",
    "week2": "2주차 예상 진행사항",
    "week3": "3주차 예상 진행사항",
    "week4": "4주차 예상 진행사항"
  }
}`
              },
              {
                role: 'user',
                content: `다음 목표를 분석해줘: "${goal}"

이 목표를 달성하기 위해 필요한 모든 요소들을 체계적으로 분석하고, Strategy Agent가 활용할 수 있는 데이터를 제공해줘.`
              }
            ]
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error('목표 분석에 실패했습니다.');
        }
        
        const aiResponse = data.choices[0].message.content;
        
        // JSON 추출
        try {
          const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            analysisData = JSON.parse(jsonMatch[0]);
          } else {
            throw new Error('JSON 형태가 아님');
          }
        } catch (e) {
          contentDiv.innerHTML = `
            <div style="padding: 20px; background: #f8f9fa; border-radius: 8px; line-height: 1.6;">
              ${aiResponse.replace(/\n/g, '<br>')}
            </div>
          `;
          return;
        }
        
        // 분석 결과 표시
        let html = `
          <div class="analysis-item">
            <h4>🎯 정제된 목표</h4>
            <p><strong>${analysisData.main_goal}</strong></p>
            <p>${analysisData.goal_breakdown}</p>
          </div>
          
          <div class="analysis-item">
            <h4>⏰ 추천 학습 기간</h4>
            <p><strong>${analysisData.duration_weeks}주</strong> - ${analysisData.duration_reason}</p>
          </div>
          
          <div class="analysis-item">
            <h4>📚 난이도 및 학습량</h4>
            <p><strong>난이도:</strong> ${analysisData.difficulty_level}</p>
            <p><strong>주당 과제 수:</strong> ${analysisData.tasks_per_week}개 (적정 학습량)</p>
          </div>
          
          <div class="analysis-item">
            <h4>🔑 핵심 키워드</h4>
            <div class="keyword-tags">
        `;
        
        analysisData.keywords.forEach(keyword => {
          html += `<span class="keyword-tag">${keyword}</span>`;
        });
        
        html += `
            </div>
          </div>
          
          <div class="analysis-item">
            <h4>📅 예상 학습 타임라인</h4>
        `;
        
        Object.entries(analysisData.expected_timeline).forEach(([week, content]) => {
          const weekNum = week.replace('week', '');
          html += `
            <div class="timeline-item">
              <div class="timeline-week">${weekNum}주차</div>
              <div class="timeline-content">${content}</div>
            </div>
          `;
        });
        
        html += '</div>';
        
        contentDiv.innerHTML = html;
        
        // 분석 데이터를 localStorage에 저장
        localStorage.setItem('analysis_data', JSON.stringify(analysisData));
        
      } catch (error) {
        console.error('분석 오류:', error);
        contentDiv.innerHTML = `
          <div style="color: #d32f2f; padding: 20px; text-align: center;">
            ❌ 목표 분석 중 오류가 발생했습니다. 다시 시도해주세요.
            <br><small>${error.message}</small>
          </div>
        `;
      }
    });
    
    // 전략 설계로 이동
    document.getElementById('to-strategy-btn').addEventListener('click', () => {
      if (analysisData) {
        window.location.href = 'strategy-agent.html';
      } else {
        alert('분석을 먼저 완료해주세요.');
      }
    });
    
    // 목표 수정
    document.getElementById('modify-goal-btn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
