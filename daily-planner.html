<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루 계획 코치</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="planner-style.css">
</head>
<body>
  <div class="container">
    <h1>📅 하루 계획 코치</h1>
    
    <div class="input-section">
      <div class="input-group">
        <label>📝 오늘 해야 할 일들을 알려주세요</label>
        <textarea id="tasks-input" placeholder="예: UX 과제 완성, 영어 공부, 운동하기, 장보기 등..." rows="3"></textarea>
      </div>
      
      <div class="input-row">
        <div class="input-group">
          <label>⏰ 시작 시간</label>
          <input type="time" id="start-time" value="09:00">
        </div>
        <div class="input-group">
          <label>🏁 종료 시간</label>
          <input type="time" id="end-time" value="22:00">
        </div>
      </div>
      
      <div class="input-group">
        <label>💭 추가 상황이나 제약사항이 있나요?</label>
        <textarea id="constraints-input" placeholder="예: 3시에 병원 가야함, 집중력이 아침에 좋음, 점심은 12시에 먹고 싶음 등..." rows="2"></textarea>
      </div>
      
      <button id="plan-btn">📋 하루 일정 짜기</button>
    </div>
    
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>당신만의 완벽한 하루 계획을 세우고 있어요...</p>
    </div>
    
    <div id="result-section" class="result-section hidden">
      <h2>✨ 오늘의 계획</h2>
      <div id="plan-result"></div>
      <div class="action-buttons">
        <button id="regenerate-btn" class="secondary-btn">🔄 다시 짜기</button>
        <button id="save-btn" class="primary-btn">📱 일정 저장</button>
      </div>
    </div>
  </div>

  <script src="daily-planner.js"></script>
</body>
</html>
