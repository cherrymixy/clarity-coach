<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전략 설계 코치 - 주차별 학습 전략 생성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .strategy-form {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      border-left: 4px solid #007aff;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    .keywords-input {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    
    .keyword-tag {
      background: #007aff;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .keyword-tag .remove {
      cursor: pointer;
      font-weight: bold;
    }
    
    .add-keyword {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .add-keyword input {
      flex: 1;
    }
    
    .strategy-container {
      margin-top: 30px;
    }
    
    .week-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border-left: 4px solid #28a745;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .week-section h3 {
      color: #28a745;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.3rem;
    }
    
    .tasks-list h4 {
      color: #333;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
    
    .tasks-list ul {
      margin: 0;
      padding-left: 20px;
    }
    
    .tasks-list li {
      margin-bottom: 8px;
      line-height: 1.5;
    }
    
    .next-steps {
      background: #e3f2fd;
      border-radius: 12px;
      padding: 24px;
      border-left: 4px solid #2196f3;
    }
    
    .next-steps h3 {
      color: #2196f3;
      margin-top: 0;
      margin-bottom: 16px;
    }
    
    .next-steps ul {
      margin: 0;
      padding-left: 20px;
    }
    
    .next-steps li {
      margin-bottom: 8px;
      line-height: 1.5;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .loading .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #c62828;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 전략 설계 코치</h1>
    <p class="subtitle">목표를 입력하면 주차별 학습 전략을 설계해드립니다</p>
    
    <div class="strategy-form">
      <form id="strategy-form">
        <div class="form-group">
          <label for="main-goal">주요 목표</label>
          <textarea id="main-goal" placeholder="달성하고 싶은 목표를 구체적으로 입력해주세요. (예: 미술사에 대해 영어로 말할 수 있게 되기)" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="duration">학습 기간</label>
          <select id="duration" required>
            <option value="">기간을 선택하세요</option>
            <option value="2주">2주</option>
            <option value="4주">4주</option>
            <option value="6주">6주</option>
            <option value="8주">8주</option>
            <option value="12주">12주</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="tasks-per-week">주당 과제 수</label>
          <select id="tasks-per-week" required>
            <option value="">과제 수를 선택하세요</option>
            <option value="1">주 1개</option>
            <option value="2">주 2개</option>
            <option value="3">주 3개</option>
            <option value="4">주 4개</option>
            <option value="5">주 5개</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>키워드 (관련 주제나 핵심 개념)</label>
          <div class="add-keyword">
            <input type="text" id="keyword-input" placeholder="키워드를 입력하고 Enter를 누르세요">
            <button type="button" id="add-keyword-btn">추가</button>
          </div>
          <div id="keywords-container" class="keywords-input"></div>
        </div>
        
        <button type="submit" id="generate-strategy-btn" class="btn">전략 생성하기</button>
      </form>
    </div>
    
    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>전략을 설계하고 있습니다...</p>
    </div>
    
    <div id="error-message" class="error-message" style="display: none;"></div>
    
    <div id="strategy-result"></div>
  </div>
  
  <script src="strategy-agent.js"></script>
  <script>
    // 전역 변수
    let keywords = [];
    const strategyAgent = new StrategyAgent();
    
    // DOM 요소들
    const form = document.getElementById('strategy-form');
    const keywordInput = document.getElementById('keyword-input');
    const addKeywordBtn = document.getElementById('add-keyword-btn');
    const keywordsContainer = document.getElementById('keywords-container');
    const loading = document.getElementById('loading');
    const errorMessage = document.getElementById('error-message');
    const strategyResult = document.getElementById('strategy-result');
    
    // 키워드 추가
    function addKeyword() {
      const keyword = keywordInput.value.trim();
      if (keyword && !keywords.includes(keyword)) {
        keywords.push(keyword);
        renderKeywords();
        keywordInput.value = '';
      }
    }
    
    // 키워드 제거
    function removeKeyword(keyword) {
      keywords = keywords.filter(k => k !== keyword);
      renderKeywords();
    }
    
    // 키워드 렌더링
    function renderKeywords() {
      keywordsContainer.innerHTML = keywords.map(keyword => 
        `<div class="keyword-tag">
          ${keyword}
          <span class="remove" onclick="removeKeyword('${keyword}')">&times;</span>
        </div>`
      ).join('');
    }
    
    // 이벤트 리스너
    addKeywordBtn.addEventListener('click', addKeyword);
    keywordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addKeyword();
      }
    });
    
    // 폼 제출
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const mainGoal = document.getElementById('main-goal').value;
      const duration = document.getElementById('duration').value;
      const tasksPerWeek = document.getElementById('tasks-per-week').value;
      
      if (!mainGoal || !duration || !tasksPerWeek) {
        showError('모든 필수 항목을 입력해주세요.');
        return;
      }
      
      if (keywords.length === 0) {
        showError('최소 하나의 키워드를 추가해주세요.');
        return;
      }
      
      const goalData = {
        main_goal: mainGoal,
        duration: duration,
        keywords: keywords,
        tasks_per_week: parseInt(tasksPerWeek)
      };
      
      await generateStrategy(goalData);
    });
    
    // 전략 생성
    async function generateStrategy(goalData) {
      try {
        showLoading(true);
        hideError();
        
        const strategyData = await strategyAgent.generateStrategy(goalData);
        const html = strategyAgent.renderStrategy(strategyData);
        
        strategyResult.innerHTML = html;
        showLoading(false);
        
        // 결과로 스크롤
        strategyResult.scrollIntoView({ behavior: 'smooth' });
        
      } catch (error) {
        console.error('전략 생성 오류:', error);
        showError('전략 생성 중 오류가 발생했습니다. 다시 시도해주세요.');
        showLoading(false);
      }
    }
    
    // 로딩 표시/숨김
    function showLoading(show) {
      loading.style.display = show ? 'block' : 'none';
    }
    
    // 에러 표시/숨김
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }
    
    function hideError() {
      errorMessage.style.display = 'none';
    }
  </script>
</body>
</html>
